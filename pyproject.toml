[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db2010-runner"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["numpy==2.3.4", "pyarrow==26.0.0", "duckdb==1.5.6", "capstone==5.0.7", "aiohttp==3.14.3"]

[project.scripts]
db2010 = "db2010.cli:main"
db2010-provision-fs = "db2010.provision_fs:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest", "playwright==1.61.0", "setuptools>=68", "wheel"]
assets = ["trimesh==5.1.1", "pillow==13.0.0"]

[tool.setuptools.package-data]
"db2010" = ["resources/*.json", "resources/*.md", "resources/*.xml"]
"db2010.ui" = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/model/*", "assets/vendor/*"]
